[project]
name = "noteveo"
version = "0.1.0"
description = "Que la tele del salón muestre la pared que tiene detrás"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "rawpy>=0.23",
    "exifread>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noteveo"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", ".specify", ".agent", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
